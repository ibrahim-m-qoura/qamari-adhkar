/* ============ GLOBAL ============ */
:root{--radius:22px;--radius-sm:14px;--radius-lg:28px;--font:'IBM Plex Sans Arabic',system-ui,sans-serif;--t:0.3s cubic-bezier(0.4,0,0.2,1);--font-size:16px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;transition:background var(--t),color var(--t);overflow-x:hidden;padding-bottom:110px;font-size:var(--font-size)}
h1,h2,h3,h4{font-weight:600;line-height:1.3;letter-spacing:-0.01em}
h1{font-size:1.6rem}h2{font-size:1.25rem}h3{font-size:1.05rem}
p{color:var(--text-2)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent-soft);color:var(--text)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:var(--accent-soft);border-radius:3px}

.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-border);border-radius:var(--radius);box-shadow:var(--specular),var(--shadow);transition:background var(--t),border-color var(--t),box-shadow var(--t)}
@supports not (backdrop-filter:blur(1px)){.glass{background:var(--glass-strong)}}

.moon-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(ellipse at 50% -20%,var(--moon) 0%,transparent 50%),radial-gradient(ellipse at 80% 120%,var(--accent-soft) 0%,transparent 40%),linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%);pointer-events:none;transition:background var(--t)}
.moon-glow{position:absolute;border-radius:50%;filter:blur(100px);opacity:.35;animation:float 20s ease-in-out infinite}
.moon-glow--1{width:400px;height:400px;top:-150px;left:50%;transform:translateX(-50%);background:radial-gradient(circle,var(--moon),transparent 70%);opacity:.22}
.moon-glow--2{width:300px;height:300px;bottom:5%;left:-100px;background:radial-gradient(circle,var(--accent),transparent 70%);animation-delay:-7s}
.moon-glow--3{width:250px;height:250px;bottom:20%;right:-80px;background:radial-gradient(circle,var(--moon),transparent 70%);animation-delay:-14s;opacity:.15}

<script>
/* =========================================================
   1) STORAGE
   ========================================================= */
const Storage = (() => {
  const KEY = 'qamari_v2';
  const VERSION = 2;
  const DEFAULT = () => ({
    version: VERSION,
    theme: 'moonlight',
    settings: { fontSize: 16, showTashkeel: true, vibration: true, autoAdvance: false },
    progress: {},
    favorites: [],
    tasbeeh: { current: 0, target: 33, dhikr: 'سبحان الله', totalAllTime: 0, today: { date: '', count: 0 }, sessions: [] },
    stats: { activeDays: [], daily: {} },
    lastVisit: null
  });
  function merge(t, s) {
    const o = { ...t };
    for (const k in s) {
      if (s[k] && typeof s[k] === 'object' && !Array.isArray(s[k])) o[k] = merge(t[k] || {}, s[k]);
      else o[k] = s[k];
    }
    return o;
  }
  function read() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return DEFAULT();
      return merge(DEFAULT(), JSON.parse(raw));
    } catch(e) { return DEFAULT(); }
  }
  function write(s) {
    try { localStorage.setItem(KEY, JSON.stringify(s)); return true; }
    catch(e) { console.error(e); return false; }
  }
  function update(fn) { const s = read(); fn(s); write(s); return s; }
  function exportData() {
    const data = read();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `qamari-backup-${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }
  function importData(str) {
    try {
      const imp = JSON.parse(str);
      if (!imp.version) throw new Error('ملف غير صالح');
      write(merge(DEFAULT(), imp));
      return { success: true };
    } catch(e) { return { success: false, error: e.message }; }
  }
  function reset() { localStorage.removeItem(KEY); }
  return { read, write, update, exportData, importData, reset };
})();

/* =========================================================
   2) ADHKAR DATA — حصن المسلم / البخاري / مسلم
   ========================================================= */

   ========================================================= */
const fmtGreg = new Intl.DateTimeFormat('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
let fmtHijri = null;
try { fmtHijri = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}); } catch(e){}

const Utils = {
  greet() { const h = new Date().getHours();
    if (h<5) return 'طاب ليلك'; if (h<12) return 'صباح الخير';
    if (h<17) return 'طاب نهارك'; if (h<20) return 'مساء الخير'; return 'طاب مساؤك'; },
  gregorian() { return fmtGreg.format(new Date()); },
  hijri() { return fmtHijri ? fmtHijri.format(new Date()) : ''; },
  todayKey() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; },
  vibrate(ms=10) { const s = Storage.read(); if (s.settings.vibration && navigator.vibrate) navigator.vibrate(ms); },
  stripTashkeel(t) { return t.replace(/[\u064B-\u065F\u0670]/g, ''); }
};

const Theme = {
  init() { this.apply(Storage.read().theme || 'moonlight'); },
  apply(id) {
    document.documentElement.setAttribute('data-theme', id);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) {
      const colors = {moonlight:'#0B1016',clear:'#EEF2F5',layl:'#0C0A18',sand:'#F4EFE6',emerald:'#08120E',rose:'#F8EDF0',ocean:'#061520',charcoal:'#141414'};
      meta.setAttribute('content', colors[id] || '#0B1016');
    }
  },
  set(id) { Storage.update(s => { s.theme = id; }); this.apply(id); }
};

/* =========================================================
   6) ADHKAR PAGE
   ========================================================= */
const AdhkarPage = {
  currentCat: 'morning',
  render(forceCat) {
    const s = Storage.read();
    const today = Utils.todayKey();
    const cat = forceCat || this.currentCat;
    this.currentCat = cat;
    const items = AdhkarData[cat] || [];
    const prog = s.progress[today] || {};

    return `
      <header class="app-header"><h1>الأذكار</h1></header>
      <div class="cat-scroll">
        ${Object.keys(AdhkarData).map(c => `
          <button class="cat-chip ${c===cat?'active':''}" onclick="AdhkarPage.switchCat('${c}')">
            ${CategoryIcons[c]} ${CategoryNames[c]}
          </button>
        `).join('')}
      </div>
      <div class="adhkar-list">
        ${items.map(d => {
          const p = prog[d.id] || { count: 0, completed: false };
          const done = p.completed;
          const isFav = s.favorites.includes(d.id);
          return `
            <div class="adhkar-card glass ${done?'done':''}" id="card-${d.id}">
              <button class="fav-btn ${isFav?'active':''}" onclick="event.stopPropagation(); AdhkarPage.toggleFav('${d.id}')">${isFav?'⭐':'☆'}</button>
              <div class="adhkar-text" onclick="AdhkarPage.increment('${d.id}')">${d.text}</div>
              <div class="adhkar-footer">
                <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
                  <span class="adhkar-source">${d.source}</span>
                  ${d.grade ? `<span class="adhkar-grade">${d.grade}</span>` : ''}
                </div>
                <span class="adhkar-counter" id="cnt-${d.id}"><strong>${p.count}</strong> / ${d.count}</span>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  },
  mount() {},
  switchCat(c) { this.currentCat = c; Router.handle(); },
  toggleFav(id) {
    Storage.update(s => {
      const i = s.favorites.indexOf(id);
      if (i >= 0) s.favorites.splice(i, 1);
      else s.favorites.push(id);
    });
    Router.handle();
  },
  increment(id) {
    const s = Storage.read();
    const today = Utils.todayKey();
    const all = AdhkarData[this.currentCat] || [];
    const item = all.find(d => d.id === id);
    if (!item) return;
    if (!s.progress[today]) s.progress[today] = {};
    const p = s.progress[today][id] || { count: 0, completed: false };
    if (p.completed) return;
    p.count++;
    if (p.count >= item.count) p.completed = true;
    s.progress[today][id] = p;
    if (!s.stats.daily[today]) s.stats.daily[today] = { completed: 0, totalReps: 0 };
    s.stats.daily[today].totalReps++;
    if (p.completed) s.stats.daily[today].completed++;
    Storage.write(s);
    Utils.vibrate(15);
    const card = document.getElementById('card-' + id);
    if (card) {
      const cnt = document.getElementById('cnt-' + id);
      if (cnt) cnt.innerHTML = `<strong>${p.count}</strong> / ${item.count}`;
      if (p.completed) card.classList.add('done');
    }
  }
};

/* =========================================================
   7) TASBEEH PAGE
   ========================================================= */
const TasbeehPage = {
  render() {
    const s = Storage.read();
    const t = s.tasbeeh;
    const today = Utils.todayKey();
    const todayCount = (t.today && t.today.date === today) ? t.today.count : 0;
    return `
      <header class="app-header"><h1>المسبحة</h1></header>
      <div class="glass" style="padding:32px 20px;text-align:center;border-radius:var(--radius-lg);margin-bottom:16px">
        <div style="font-size:.85rem;color:var(--text-2);margin-bottom:8px">${t.dhikr}</div>
        <div id="tasbeehCount" style="font-size:4.5rem;font-weight:700;color:var(--accent);line-height:1.1">${t.current || 0}</div>
        <div style="font-size:.8rem;color:var(--text-2);margin-bottom:24px">الهدف: ${t.target}</div>
        <button class="tasbeeh-main-btn" onclick="TasbeehPage.tap()">سبّح</button>
        <div style="display:flex;gap:10px;margin-top:24px;justify-content:center;flex-wrap:wrap">
          <button onclick="TasbeehPage.reset()" class="icon-btn" style="width:auto;padding:0 20px;height:40px;border-radius:12px;font-size:.8rem">تصفير</button>
          <button onclick="TasbeehPage.saveSession()" class="icon-btn" style="width:auto;padding:0 20px;height:40px;border-radius:12px;font-size:.8rem;background:var(--accent);color:#fff;border-color:transparent">حفظ</button>
        </div>
      </div>
      <div class="mini-stats">
        <div class="mini-stat glass"><div class="num">${t.totalAllTime || 0}</div><div class="lbl">إجمالي</div></div>
        <div class="mini-stat glass"><div class="num">${todayCount}</div><div class="lbl">اليوم</div></div>
        <div class="mini-stat glass"><div class="num">${t.sessions.length}</div><div class="lbl">جلسات</div></div>
      </div>
    `;
  },
  mount() {},
  tap() {
    const s = Storage.read();
    const t = s.tasbeeh;
    const today = Utils.todayKey();
    t.current = (t.current || 0) + 1;
    t.totalAllTime = (t.totalAllTime || 0) + 1;
    if (!t.today || t.today.date !== today) t.today = { date: today, count: 0 };
    t.today.count++;
    Storage.write(s);
    Utils.vibrate(10);
    const el = document.getElementById('tasbeehCount');
    if (el) el.textContent = t.current;
    if (t.current === t.target) Utils.vibrate([50, 30, 50, 30, 100]);
  },
  reset() {
    if (!confirm('هل تريد تصفير العداد؟')) return;
    Storage.update(s => { s.tasbeeh.current = 0; });
    const el = document.getElementById('tasbeehCount');
    if (el) el.textContent = 0;
  },
  saveSession() {
    const s = Storage.read();
    if (s.tasbeeh.current > 0) {
      s.tasbeeh.sessions.push({ dhikr: s.tasbeeh.dhikr, count: s.tasbeeh.current, date: Utils.todayKey() });
      s.tasbeeh.current = 0;
      Storage.write(s);
      Router.handle();
    }
  }
};

/* =========================================================
   8) STATS PAGE
   ========================================================= */
const StatsPage = {
  render() {
    const s = Storage.read();
    const today = Utils.todayKey();
    const daily = s.stats.daily;
    const activeDays = s.stats.activeDays;
    const todayStats = daily[today] || { completed: 0, totalReps: 0 };
    // آخر 7 أيام
    const week = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      week.push({ date: k, reps: (daily[k]?.totalReps || 0) });
    }
    const maxReps = Math.max(...week.map(w => w.reps), 1);

    return `
      <header class="app-header"><h1>الإحصائيات</h1></header>
      <div class="mini-stats" style="grid-template-columns:1fr 1fr;margin-bottom:16px">
        <div class="mini-stat glass"><div class="num">${activeDays.length}</div><div class="lbl">أيام نشطة</div></div>
        <div class="mini-stat glass"><div class="num">${s.tasbeeh.totalAllTime || 0}</div><div class="lbl">إجمالي تسبيح</div></div>
        <div class="mini-stat glass"><div class="num">${todayStats.completed}</div><div class="lbl">أذكار اليوم</div></div>
        <div class="mini-stat glass"><div class="num">${todayStats.totalReps}</div><div class="lbl">تكرارات اليوم</div></div>
      </div>
      <div class="section-title"><h3>آخر 7 أيام</h3></div>
      <div class="glass" style="padding:20px">
        <div style="display:flex;align-items:flex-end;gap:8px;height:120px">
          ${week.map(w => `
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
              <div style="width:100%;background:var(--accent-grad);border-radius:6px;height:${Math.max(4, (w.reps/maxReps)*100)}%;min-height:4px;transition:height .3s"></div>
              <span style="font-size:.6rem;color:var(--text-2)">${w.date.slice(5)}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  },
  mount() {}
};

/* =========================================================
   9) SETTINGS PAGE
   ========================================================= */
const SettingsPage = {
  render() {
    const s = Storage.read();
    return `
      <header class="app-header"><h1>الإعدادات</h1></header>

      <div class="section-title"><h3>الثيمات</h3></div>
      <div class="glass" style="padding:12px">
        <div class="theme-grid">
          ${THEMES.map(th => `
            <div class="theme-swatch ${s.theme===th.id?'active':''}" onclick="SettingsPage.setTheme('${th.id}')">
              <div class="swatch-dot" style="background:${th.color}"></div>
              <div class="swatch-name">${th.name}</div>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="section-title"><h3>حجم الخط</h3></div>
      <div class="glass" style="padding:16px;display:flex;align-items:center;gap:12px">
        <span style="font-size:.9rem">${s.settings.fontSize}px</span>
        <input type="range" min="14" max="22" value="${s.settings.fontSize}" oninput="SettingsPage.setFontSize(this.value)" style="flex:1" />
      </div>

      <div class="section-title"><h3>الاهتزاز</h3></div>
      <div class="glass setting-row">
        <span style="font-size:.9rem">الاهتزاز عند العد</span>
        <div class="toggle ${s.settings.vibration?'on':''}" onclick="SettingsPage.toggle('vibration')"></div>
      </div>

      <div class="section-title"><h3>هدف المسبحة</h3></div>
      <div class="glass" style="padding:8px;display:flex;flex-direction:column;gap:4px">
        ${[33, 99, 100].map(n => `
          <button onclick="SettingsPage.setTarget(${n})" style="padding:14px 16px;border-radius:12px;text-align:right;font-size:.9rem;background:${s.tasbeeh.target===n?'var(--accent-soft)':'transparent'};color:${s.tasbeeh.target===n?'var(--accent)':'var(--text)'}">
            ${n} تسبيحة
          </button>
        `).join('')}
      </div>

      <div class="section-title"><h3>البيانات</h3></div>
      <div class="glass" style="padding:16px;display:flex;flex-direction:column;gap:8px">
        <button onclick="Storage.exportData()" style="padding:14px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-size:.9rem">تصدير البيانات</button>
        <button onclick="SettingsPage.importFile()" style="padding:14px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-size:.9rem">استيراد البيانات</button>
        <button onclick="SettingsPage.resetAll()" style="padding:14px;border-radius:12px;background:rgba(200,80,80,.15);color:#c85050;font-size:.9rem">حذف كل البيانات</button>
      </div>

      <p style="text-align:center;font-size:.75rem;color:var(--text-2);margin-top:24px">
        أذكار قمرية v2.0 — المصادر: حصن المسلم، البخاري، مسلم
      </p>
    `;
  },
  mount() {},
  setTheme(id) { Theme.set(id); Router.handle(); },
  toggle(key) { Storage.update(s => { s.settings[key] = !s.settings[key]; }); Router.handle(); },
  setTarget(n) { Storage.update(s => { s.tasbeeh.target = n; }); Router.handle(); },
  setFontSize(v) {
    Storage.update(s => { s.settings.fontSize = parseInt(v); });
    document.documentElement.style.setProperty('--font-size', v + 'px');
  },
  importFile() {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json';
    inp.onchange = e => {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = ev => {
        const res = Storage.importData(ev.target.result);
        if (res.success) { alert('تم الاستيراد بنجاح'); location.reload(); }
        else alert('فشل الاستيراد: ' + res.error);
      };
      r.readAsText(f);
    };
    inp.click();
  },
  resetAll() {
    if (confirm('هل أنت متأكد من حذف كل البيانات؟')) {
      Storage.reset();
      location.reload();
    }
  }
};

/* =========================================================
   10) ROUTER
   ========================================================= */
const Router = {
  routes: { home: HomePage, adhkar: AdhkarPage, tasbeeh: TasbeehPage, stats: StatsPage, settings: SettingsPage },
  init() { window.addEventListener('hashchange', () => this.handle()); this.handle(); },
  go(hash) { location.hash = hash; },
  handle() {
    const hash = location.hash.replace('#/', '') || 'home';
    const [route, sub] = hash.split('/');
    const page = this.routes[route] || HomePage;
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('is-active', el.dataset.route === route);
    });
    const view = document.getElementById('view');
    if (route === 'adhkar') {
      let forceCat = null;
      if (sub === 'morning') forceCat = 'morning';
      else if (sub === 'evening') forceCat = 'evening';
      view.innerHTML = AdhkarPage.render(forceCat);
      AdhkarPage.mount();
    } else {
      view.innerHTML = page.render();
      page.mount && page.mount();
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
};

/* =========================================================
   11) BOOTSTRAP
   ========================================================= */
(function init() {
  Theme.init();
  const fs = Storage.read().settings.fontSize;
  document.documentElement.style.setProperty('--font-size', fs + 'px');

  Storage.update(s => {
    const today = Utils.todayKey();
    if (!s.stats.daily[today]) s.stats.daily[today] = { completed: 0, totalReps: 0 };
    if (!s.stats.activeDays.includes(today)) s.stats.activeDays.push(today);
    if (!s.tasbeeh.today || s.tasbeeh.today.date !== today) s.tasbeeh.today = { date: today, count: 0 };
    s.lastVisit = new Date().toISOString();
  });

  Router.init();
})();
</script>
</body>
</html>
